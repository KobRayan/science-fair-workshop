# Nom de l'application
spring.application.name=Fetescience

# Serveure
server.port=8081

# Connexion MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/atelier_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=Lesyiribas
spring.datasource.password=Lesyiribas@2025!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# (facultatif) niveau de logs SQL/JPA
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Désactivation de H2
spring.h2.console.enabled=false

# Configuration Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true