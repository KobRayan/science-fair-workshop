<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="user-bar" class="user-bar">
    <div class="user-bar-content">
        <!-- OPTION A: LOGGED IN -->
        <div th:if="${session.user != null}" class="user-info">
            <span>👋 Bonjour, <strong th:text="${session.user.nom}">User</strong></span>

            <!-- Dashboard Link based on Role -->
            <a th:if="${session.user.role.name() == 'PARTICIPANT'}"
               th:href="@{'/inscriptions/' + ${session.user.id}}" class="btn-sm">
                Mes Inscriptions
            </a>
            <a th:if="${session.user.role.name() == 'ANIMATEUR'}"
               href="/animateur-page" class="btn-sm">
                Espace Animateur
            </a>

            <a href="/auth/logout" class="btn-sm btn-outline">Déconnexion</a>
        </div>

        <!-- OPTION B: NOT LOGGED IN -->
        <div th:if="${session.user == null}" class="auth-buttons">
            <a href="/auth/login" class="btn-sm">Se connecter</a>
            <a href="/auth/register" class="btn-sm btn-highlight">Créer un compte</a>
        </div>
    </div>
</div>
</body>
</html>
