<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link type="text/css" rel="stylesheet" th:href="@{/css/inscription.css}">
    <title>Vos inscriptions</title>
</head>
<body>
<h1 id="inscription-planning">Vos inscriptions aux ateliers</h1>

<div id="inscription-list">
    <!-- Inscription 1 : Date éloignée (plus de 2 jours) - Bouton visible -->
    <div th:each="inscription : ${inscriptions}"
         class="inscription"
         th:attr="id-inscription=${inscription.id}">
        <table>
            <tr><td>Titre</td><td th:text="${inscription.atelier.titre}">Titre</td></tr>
            <tr><td>Créneau</td><td th:text="${inscription.creneau.horaireDebut} + 'h'">Horaire</td></tr>
            <tr><td>Lieu</td><td th:text="${inscription.creneau.lieu}">Lieu</td></tr>
            <tr><td>Durée</td><td th:text="${inscription.creneau.duree} + ' min'">Durée</td></tr>
            <tr><td>Statut</td><td th:text="${inscription.statut}">Statut</td></tr>
        </table>
        <button class="btn-desinscription">Se désinscrire</button>
    </div>
</div>

<script th:src="@{/js/inscriptions.js}"></script>
</body>
</html>
