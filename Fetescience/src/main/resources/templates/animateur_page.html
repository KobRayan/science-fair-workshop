<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Espace Animateur</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: user-bar}"></div>

<div class="container">
    <header>
        <h1>Espace Animateur</h1>
        <p class="subtitle">Gestion de vos ateliers</p>
        <div style="margin-top: 10px;">
            <span style="background: #e9ecef; padding: 5px 10px; border-radius: 15px; font-size: 0.9em;">
                👤 <span th:text="${session.user.nom}">Animateur</span>
            </span>
            <a href="/auth/logout" class="btn btn-secondary" style="padding: 5px 15px; font-size: 0.9em; margin-left: 10px; text-decoration: none;">Déconnexion</a>
        </div>
    </header>

    <main>
        <div class="info-section">
            <h2>Bienvenue dans votre espace !</h2>
            <p>Ici, vous pourrez bientôt gérer vos ateliers et voir les inscrits.</p>
            <!-- Content to be added later -->
        </div>

        <div style="margin-top: 30px; text-align: center;">
            <a href="/" class="btn btn-primary">Retour à l'accueil</a>
        </div>
    </main>
</div>
</body>
</html>
