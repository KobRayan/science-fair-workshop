<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <title>Nouvelle inscription - Fête de la Science</title>
</head>
<body>

<!-- ✅ NAVBAR ADDED HERE -->
<div th:replace="~{fragments/navbar :: user-bar}"></div>

<div class="container">
    <header>
        <h1>Inscription à un atelier</h1>
    </header>

    <main>
        <div th:if="${erreur}" class="alert alert-danger" style="color:red; background:#fee; padding:10px;">
            <span th:text="${erreur}"></span>
        </div>

        <form id="form-inscription" method="POST" action="/inscrire_atelier">

            <div class="form-group">
                <label for="nom">Votre Nom :</label>
                <!-- ✅ PRE-FILLED & READONLY IF LOGGED IN -->
                <input
                        type="text"
                        id="nom"
                        name="nom"
                        required
                        th:value="${preFilledName}"
                        th:readonly="${preFilledName != null}"
                        th:classappend="${preFilledName != null} ? 'readonly-input' : ''"
                        placeholder="Ex: Alice">

                <small th:if="${preFilledName != null}" style="color:green;">
                    ✓ Compte connecté vérifié
                </small>
            </div>

            <!-- ... (Keep Atelier & Creneau Selects exactly as before) ... -->
            <div class="form-group">
                <label for="atelierSelect">Atelier :</label>
                <select id="atelierSelect" onchange="chargerCreneaux()">
                    <option value="">-- Sélectionnez un atelier --</option>
                    <option th:each="atelier : ${ateliers}" th:value="${atelier.id}" th:text="${atelier.titre}"></option>
                </select>
            </div>

            <div class="form-group" id="creneau-group" style="display:none;">
                <label for="creneauId">Créneau disponible :</label>
                <select id="creneauId" name="creneauId" required></select>
                <small id="creneau-msg">Seuls les créneaux avec des places sont affichés.</small>
            </div>

            <div class="form-actions">
                <button type="submit" id="btn-submit" class="btn btn-primary" disabled>S'inscrire</button>
            </div>
        </form>
    </main>
</div>

<!-- Keep your Javascript exactly as it was -->
<script>
    // ... paste your existing JS for chargerCreneaux here ...
    // OR create separate JS file
    async function chargerCreneaux() {
        // ... (same logic as before) ...
        const atelierId = document.getElementById("atelierSelect").value;
        const creneauSelect = document.getElementById("creneauId");
        const creneauGroup = document.getElementById("creneau-group");
        const btnSubmit = document.getElementById("btn-submit");

        creneauSelect.innerHTML = '';
        btnSubmit.disabled = true;

        if(!atelierId) { creneauGroup.style.display = 'none'; return; }
        creneauGroup.style.display = 'block';

        const response = await fetch(`/api/ateliers/${atelierId}/creneaux`);
        const creneaux = await response.json();

        creneaux.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.id;
            opt.text = c.horaireDebut + "h (" + (c.statut ? "COMPLET" : "Libre") + ")";
            if(c.statut) opt.disabled = true;
            creneauSelect.add(opt);
        });

        creneauSelect.onchange = () => btnSubmit.disabled = false;
    }
</script>
<style>
    .readonly-input { background-color: #e9ecef; cursor: not-allowed; }
</style>
</body>
</html>
