<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gérer l'atelier</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/inscription.css}">
    <link rel="stylesheet" th:href="@{/css/management_grid.css}">

    <!-- ✅ Leaflet CSS -->
    <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
</head>
<body>

<div th:replace="~{fragments/navbar :: user-bar}"></div>

<div class="container" style="max-width: 1100px;">

    <div class="dashboard-header">
        <div class="header-text">
            <h2>Gestion de l'atelier</h2>
            <h3 th:text="${atelier.titre}">Titre de l'Atelier</h3>

            <div th:if="${atelier.description != null and !atelier.description.isEmpty()}" style="margin-bottom: 20px;">
                <div th:if="${#strings.length(atelier.description) <= 100}">
                    <p th:text="${atelier.description}" style="color: #555;"></p>
                </div>

                <div th:if="${#strings.length(atelier.description) > 100}">
                    <p>
                        <span id="desc-short">
                            <span th:text="${#strings.substring(atelier.description, 0, 100)}"></span>...
                        </span>
                        <span id="desc-full" style="display:none;" th:text="${atelier.description}"></span>
                        <br>
                        <a href="javascript:void(0);"
                           onclick="toggleDescription()"
                           id="toggle-desc-btn"
                           style="color: grey; font-size: 0.85em; text-decoration: underline; cursor: pointer;">
                            Voir plus
                        </a>
                    </p>
                </div>
            </div>
        </div>

        <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 15px;">
            <a th:href="@{/animateur_page}" class="btn btn-secondary btn-header btn-match">
                Retour au tableau de bord
            </a>

            <a th:href="@{/animateur/ateliers/{id}/modifier(id=${atelier.id})}"
               class="btn btn-navbar btn-outline btn-edit btn-match">
                <img th:src="@{/images/edit_icon.png}" alt="Edit" style="width: 20px;">
                Modifier
            </a>

            <form th:action="@{/animateur/ateliers/{id}/supprimer(id=${atelier.id})}" method="post">
                <button type="submit"
                        class="btn btn-navbar btn-outline"
                        style="color:#dc3545;"
                        onclick="return confirm('Êtes-vous sûr ?');">
                    Supprimer l'atelier
                </button>
            </form>
        </div>
    </div>

    <div class="management-grid">

        <!-- ================= CRÉNEAUX EXISTANTS ================= -->
        <div class="card">
            <h3>📅 Créneaux planifiés</h3>

            <div th:if="${#lists.isEmpty(atelier.creneaux)}">
                <p>Aucun créneau ajouté.</p>
            </div>

            <table th:unless="${#lists.isEmpty(atelier.creneaux)}">
                <thead>
                <tr>
                    <th>Horaire</th>
                    <th>Durée</th>
                    <th>Lieu</th>
                    <th>Places</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${atelier.creneaux}">
                    <td th:text="${c.horaireDebut} + 'h00'"></td>
                    <td th:text="${c.duree} + ' min'"></td>
                    <td th:text="${c.lieu}"></td>
                    <td>
                        <strong th:text="${c.inscriptions.size()}"></strong> /
                        <span th:text="${c.capacite}"></span>
                    </td>
                    <td>
                        <img th:src="@{/images/edit_icon.png}"
                             width="20"
                             th:onclick="editCreneau([[${c.id}]], [[${c.horaireDebut}]], [[${c.duree}]], [[${c.capacite}]], [[${c.lieu}]])">
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- ================= AJOUT CRÉNEAU ================= -->
        <div class="card">
            <h3>➕ Ajouter un créneau</h3>

            <form th:action="@{/animateur/ateliers/{AtelierId}/creneaux(AtelierId=${atelier.id})}"
                  th:object="${nouveauCreneau}" method="post">

                <div class="form-group">
                    <label>Heure de début :</label>
                    <input type="number" th:field="*{horaireDebut}" min="8" max="20" required>
                </div>

                <!-- ❌ MAP PREVIEW DUPLIQUÉ (CONSERVÉ MAIS DÉSACTIVÉ) -->
                <!--
                <div id="map-preview"></div>
                -->

                <div class="form-group">
                    <label>Durée :</label>
                    <input type="number" th:field="*{duree}" min="15" step="15" required>
                </div>

                <div class="form-group">
                    <label>Capacité :</label>
                    <input type="number" th:field="*{capacite}" min="1" required>
                </div>

                <div class="form-group">
                    <label>Lieu :</label>
                    <input type="text" th:field="*{lieu}" id="lieu" required>
                </div>

                <!-- ✅ MAP PREVIEW ACTIF -->
                <div id="map-preview"
                     style="height:250px; border:1px solid #ddd; border-radius:8px;"></div>

                <button type="submit" class="btn btn-primary">Ajouter</button>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: site-footer}"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script th:src="@{/js/map-preview.js}"></script>
<script th:src="@{/js/gererAtelier.js}"></script>

</body>
</html>
