# .gitlab-ci.yml
stages:
  - validation

validate-project:
  stage: validation
  image: maven:3.9.6-eclipse-temurin-17 # Recommandé : spécifie une image Docker avec Java 17 + Maven
  script:
    - echo "🚀 Pipeline Fête de la Science - Démarrage"
    - echo "📁 Structure du projet :"
    - ls -la
    - |
      if [ -f "pom.xml" ]; then
        echo "📦 Maven détecté - tentative de compilation..."
        # Modification ici : Suppression de '|| echo ...' pour que l'erreur arrête le pipeline
        mvn compile -q
      else
        echo "📝 Pas de Maven - projet en configuration"
        # Optionnel : décommentez la ligne suivante si l'absence de pom.xml doit être une erreur
        # exit 1 
      fi
    - echo "✅ Pipeline terminé avec succès !"
  only:
    - main
    - develop
    - merge_requests
    - /^feature\/.*$/  # Ajout : valide aussi vos branches feature
  allow_failure: false